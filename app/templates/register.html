{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card narrow">
    <h1>Create an account</h1>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Username <input type="text" name="username" required minlength="3" maxlength="30"
               value="{{ request.form.get('username', '') }}"></label>
        <label>Email (optional) <input type="email" name="email"
               value="{{ request.form.get('email', '') }}"></label>
        <label>Password (at least 6 characters) <input type="password" name="password" required minlength="6"></label>
        <label>Confirm password <input type="password" name="confirm" required></label>
        <button type="submit" class="button">Register</button>
    </form>
    <p>Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
